<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Radar Theo Dõi & Bắn Bóng</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #0a0e17;
      color: #e0e6ed;
      font-family: 'Segoe UI', system-ui, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px;
    }
    h1 {
      font-size: 1.6rem;
      margin-bottom: 8px;
      color: #00ff9d;
      text-shadow: 0 0 10px #00ff9d55;
    }
    .status {
      font-size: 0.95rem;
      margin-bottom: 16px;
      color: #94a3b8;
    }
    .status span { color: #00ff9d; font-weight: 600; }
    
    #radar-container {
      position: relative;
      width: min(90vw, 420px);
      height: min(90vw, 420px);
      margin-bottom: 24px;
    }
    canvas {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      background: radial-gradient(circle at center, #0f172a 0%, #020617 100%);
      box-shadow: 0 0 30px #00ff9d22, inset 0 0 40px #000;
      cursor: crosshair;
    }
    
    .controls {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      justify-content: center;
      max-width: 420px;
    }
    button {
      padding: 12px 20px;
      border: none;
      border-radius: 10px;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      transition: 0.2s;
    }
    .btn-scan { background: #0ea5e9; color: white; }
    .btn-stop { background: #64748b; color: white; }
    .btn-fire { background: #ef4444; color: white; }
    .btn-unlock { background: #8b5cf6; color: white; }
    button:active { transform: scale(0.96); }
    
    .info-box {
      margin-top: 20px;
      background: #1e293b;
      padding: 14px 20px;
      border-radius: 12px;
      font-size: 0.9rem;
      line-height: 1.6;
      max-width: 420px;
      width: 100%;
    }
  </style>
</head>
<body>
  <h1>RADAR THEO DÕI MỤC TIÊU</h1>
  <div class="status">
    Chế độ: <span id="mode">Đang quét</span> | 
    Góc: <span id="angle">90°</span> | 
    Khoảng cách: <span id="distance">-- cm</span>
  </div>

  <div id="radar-container">
    <canvas id="radar" width="400" height="400"></canvas>
  </div>

  <div class="controls">
    <button class="btn-scan" onclick="startScan()">Bắt đầu quét</button>
    <button class="btn-stop" onclick="stopScan()">Dừng</button>
    <button class="btn-fire" onclick="fireBall()">Bắn bóng</button>
    <button class="btn-unlock" onclick="unlockTarget()">Hủy khóa</button>
  </div>

  <div class="info-box">
    <b>Hướng dẫn:</b><br>
    • Click vào chấm đỏ hoặc bất kỳ vị trí nào trên radar để khóa mục tiêu<br>
    • Hệ thống sẽ tự xoay máy bắn theo hướng đã chọn<br>
    • Nhấn "Bắn bóng" để kích hoạt máy bắn dây thun
  </div>

<script>
  const canvas = document.getElementById('radar');
  const ctx = canvas.getContext('2d');
  const center = 200;
  const maxRadius = 180;
  const maxDistance = 200; // cm

  let sweepAngle = 0;
  let isScanning = true;
  let targets = [];          // {angle, distance}
  let lockedTarget = null;   // {angle, distance}
  let animationId;

  // ====== VẼ RADAR ======
  function drawRadar() {
    ctx.clearRect(0, 0, 400, 400);

    // Vòng tròn khoảng cách
    ctx.strokeStyle = '#00ff9d33';
    ctx.lineWidth = 1;
    for (let i = 1; i <= 4; i++) {
      ctx.beginPath();
      ctx.arc(center, center, (maxRadius / 4) * i, 0, Math.PI * 2);
      ctx.stroke();
    }

    // Đường chữ thập
    ctx.beginPath();
    ctx.moveTo(center - maxRadius, center);
    ctx.lineTo(center + maxRadius, center);
    ctx.moveTo(center, center - maxRadius);
    ctx.lineTo(center, center + maxRadius);
    ctx.stroke();

    // Đường quét
    if (isScanning) {
      const rad = (sweepAngle - 90) * Math.PI / 180;
      ctx.strokeStyle = '#00ff9d';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(center, center);
      ctx.lineTo(center + Math.cos(rad) * maxRadius, center + Math.sin(rad) * maxRadius);
      ctx.stroke();

      // Vệt sáng phía sau đường quét
      ctx.fillStyle = '#00ff9d15';
      ctx.beginPath();
      ctx.moveTo(center, center);
      ctx.arc(center, center, maxRadius, rad - 0.4, rad);
      ctx.fill();
    }

    // Vẽ các mục tiêu (chấm đỏ)
    targets.forEach(t => {
      const r = (t.distance / maxDistance) * maxRadius;
      const rad = (t.angle - 90) * Math.PI / 180;
      const x = center + Math.cos(rad) * r;
      const y = center + Math.sin(rad) * r;

      ctx.fillStyle = '#ff3b3b';
      ctx.beginPath();
      ctx.arc(x, y, 6, 0, Math.PI * 2);
      ctx.fill();

      // Viền sáng
      ctx.strokeStyle = '#ff3b3b88';
      ctx.lineWidth = 2;
      ctx.stroke();
    });

    // Vẽ mục tiêu đang khóa (màu vàng)
    if (lockedTarget) {
      const r = (lockedTarget.distance / maxDistance) * maxRadius;
      const rad = (lockedTarget.angle - 90) * Math.PI / 180;
      const x = center + Math.cos(rad) * r;
      const y = center + Math.sin(rad) * r;

      ctx.fillStyle = '#facc15';
      ctx.beginPath();
      ctx.arc(x, y, 9, 0, Math.PI * 2);
      ctx.fill();
      ctx.strokeStyle = '#fff';
      ctx.lineWidth = 2;
      ctx.stroke();
    }
  }

  // ====== ANIMATION ======
  function animate() {
    if (isScanning) {
      sweepAngle = (sweepAngle + 2) % 180; // quét từ 0 → 180 độ
    }
    drawRadar();
    animationId = requestAnimationFrame(animate);
  }

  // ====== XỬ LÝ CLICK ======
  canvas.addEventListener('click', (e) => {
    const rect = canvas.getBoundingClientRect();
    const scaleX = canvas.width / rect.width;
    const scaleY = canvas.height / rect.height;
    const x = (e.clientX - rect.left) * scaleX;
    const y = (e.clientY - rect.top) * scaleY;

    const dx = x - center;
    const dy = y - center;
    const distance = Math.sqrt(dx*dx + dy*dy);

    if (distance > maxRadius) return;

    let angle = Math.atan2(dy, dx) * 180 / Math.PI + 90;
    if (angle < 0) angle += 360;
    if (angle > 180) angle = 360 - angle; // giới hạn 0-180

    const distCm = Math.round((distance / maxRadius) * maxDistance);

    lockedTarget = { angle: Math.round(angle), distance: distCm };
    document.getElementById('mode').innerText = 'Đang theo dõi';
    document.getElementById('angle').innerText = lockedTarget.angle + '°';
    document.getElementById('distance').innerText = lockedTarget.distance + ' cm';

    // Gửi lệnh về ESP32
    sendToESP32(`/lock?angle=\( {lockedTarget.angle}&dist= \){lockedTarget.distance}`);
  });

  // ====== GỬI LỆNH VỀ ESP32 ======
  function sendToESP32(path) {
    fetch(path).catch(err => console.log('Gửi lệnh:', path));
  }

  function startScan() {
    isScanning = true;
    lockedTarget = null;
    document.getElementById('mode').innerText = 'Đang quét';
    sendToESP32('/scan');
  }

  function stopScan() {
    isScanning = false;
    sendToESP32('/stop');
  }

  function fireBall() {
    sendToESP32('/fire');
    alert('Đã gửi lệnh BẮN BÓNG!');
  }

  function unlockTarget() {
    lockedTarget = null;
    document.getElementById('mode').innerText = 'Đang quét';
    sendToESP32('/unlock');
  }

  // Giả lập dữ liệu mục tiêu (sau này thay bằng dữ liệu thật từ ESP32)
  setInterval(() => {
    if (isScanning && Math.random() > 0.7) {
      targets.push({
        angle: Math.random() * 180,
        distance: 40 + Math.random() * 140
      });
      if (targets.length > 8) targets.shift();
    }
  }, 800);

  // Khởi động
  animate();
</script>
</body>
</html>
